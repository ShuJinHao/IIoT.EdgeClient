name: edge-runtime-artifact-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Offline Edge artifact version; this workflow never publishes production
        required: true
        default: 1.0.0
      release_notes:
        description: Notes embedded in the offline artifact; production publishing uses Deploy-Changed
        required: true

env:
  DOTNET_NOLOGO: true
  EDGE_RELEASE_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
  EDGE_RELEASE_CHANNEL: stable
  EDGE_PACK_ID: IIoT.EdgeClient

jobs:
  validate-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Select deployment red lines and affected deployment contracts
        shell: pwsh
        run: |
          ./scripts/tests/Select-EdgeCiTests.ps1 `
            -Mode Deployment `
            -ChangedFiles @('scripts/PublishEdgeRuntime.ps1') `
            -OutputPath artifacts/ci-selection.json `
            -GitHubOutputPath ''

      - name: Restore selected validation projects
        shell: pwsh
        run: |
          $selection = Get-Content artifacts/ci-selection.json -Raw | ConvertFrom-Json
          $restoreProjects = @(
            'src/Edge/IIoT.Edge.Shell/IIoT.Edge.Shell.csproj'
            @($selection.selectedDotNetProjects.path)
          ) | Sort-Object -Unique
          foreach ($projectPath in $restoreProjects) {
            & dotnet restore $projectPath -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse
            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for selected release validation project: $projectPath"
            }
          }

      - name: Validate Edge architecture project graph
        shell: pwsh
        run: ./scripts/tests/Test-EdgeArchitectureProjectGraph.ps1 -RepositoryRoot . -SolutionPath IIoT.EdgeClient.slnx -Configuration Release

      - name: Validate Edge analyzer build fixtures
        shell: pwsh
        run: ./scripts/tests/Test-EdgeArchitectureAnalyzerFixtures.ps1 -RepositoryRoot . -Configuration Release

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = $env:EDGE_RELEASE_VERSION
          $channel = $env:EDGE_RELEASE_CHANNEL
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.StartsWith('edge-v')) {
              $version = $tag.Substring(6)
            } elseif ($tag.StartsWith('v')) {
              $version = $tag.Substring(1)
            } else {
              $version = $tag
            }
            $channel = 'stable'
          }

          if ($channel -ne 'stable') {
            throw "Production Edge releases must use stable channel."
          }

          "EDGE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDGE_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved Edge release: version=$version channel=$channel"

      - name: Run selected release validation and record current discovery
        shell: pwsh
        run: ./scripts/tests/Invoke-EdgeCiSelectedTests.ps1 -SelectionPath artifacts/ci-selection.json -ResultsDirectory artifacts/ci-test-results -Configuration Release

      - name: Scan vulnerable NuGet packages
        shell: pwsh
        run: ./scripts/TestEdgePackageVulnerabilities.ps1

  package-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: validate-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = $env:EDGE_RELEASE_VERSION
          $channel = $env:EDGE_RELEASE_CHANNEL
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.StartsWith('edge-v')) {
              $version = $tag.Substring(6)
            } elseif ($tag.StartsWith('v')) {
              $version = $tag.Substring(1)
            } else {
              $version = $tag
            }
            $channel = 'stable'
          }

          if ($channel -ne 'stable') {
            throw "Production Edge releases must use stable channel."
          }

          "EDGE_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EDGE_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved Edge release: version=$version channel=$channel"

      - name: Run runtime publish smoke test
        shell: pwsh
        run: ./scripts/TestEdgeRuntimePublish.ps1 -Configuration Release -Version $env:EDGE_RELEASE_VERSION -RuntimeIdentifier win-x64 -SelfContained

      - name: Publish runtime directory
        shell: pwsh
        run: ./scripts/PublishEdgeRuntime.ps1 -Configuration Release -Version $env:EDGE_RELEASE_VERSION -RuntimeIdentifier win-x64 -SelfContained -OutputRoot publish/edge-runtime -CleanOutput

      - name: Resolve release notes
        shell: pwsh
        env:
          EDGE_RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          $releaseNotes = ''
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $releaseNotes = $env:EDGE_RELEASE_NOTES_INPUT
          } else {
            $releaseNotes = git for-each-ref "refs/tags/$env:GITHUB_REF_NAME" --format='%(contents:body)'
          }

          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "Production Edge releases require explicit release notes. For workflow_dispatch fill release_notes; for tag releases use an annotated tag with a non-empty body."
          }

          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $notesPath = "publish/edge-release-notes.md"
          Set-Content -Path $notesPath -Encoding UTF8 -Value $releaseNotes.Trim()
          "EDGE_RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack Velopack releases
        shell: pwsh
        run: ./scripts/PackEdgeClientVelopack.ps1 -Version $env:EDGE_RELEASE_VERSION -Channel $env:EDGE_RELEASE_CHANNEL -RuntimeIdentifier win-x64 -SelfContained -OutputRoot publish/edge-velopack -ReleaseNotes $env:EDGE_RELEASE_NOTES_PATH -CleanOutput -SkipVeloAppCheck:$true

      - name: Validate Velopack releases
        shell: pwsh
        run: ./scripts/TestEdgeVelopackPackage.ps1 -OutputRoot publish/edge-velopack -Channel $env:EDGE_RELEASE_CHANNEL -Version $env:EDGE_RELEASE_VERSION

      - name: Publish installer artifact
        shell: pwsh
        run: ./scripts/PublishEdgeClientInstallerArtifact.ps1 -Version $env:EDGE_RELEASE_VERSION -ReleaseChannel $env:EDGE_RELEASE_CHANNEL -OutputRoot publish/edge-installer-artifacts -RuntimeLayoutRoot publish/edge-runtime -VelopackSetupPath "publish/edge-velopack/$env:EDGE_PACK_ID-$env:EDGE_RELEASE_CHANNEL-Setup.exe" -ReleaseNotes (Get-Content -Raw -Encoding UTF8 $env:EDGE_RELEASE_NOTES_PATH) -CleanOutput

      - name: Validate installer artifact
        shell: pwsh
        run: ./scripts/TestEdgeClientInstallerArtifact.ps1 -ArtifactRoot "publish/edge-installer-artifacts/$env:EDGE_RELEASE_CHANNEL/$env:EDGE_RELEASE_VERSION" -ExpectedChannel $env:EDGE_RELEASE_CHANNEL -ExpectedVersion $env:EDGE_RELEASE_VERSION

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-runtime-package
          path: publish/edge-runtime/**

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-installer-artifact
          path: publish/edge-installer-artifacts/${{ env.EDGE_RELEASE_CHANNEL }}/${{ env.EDGE_RELEASE_VERSION }}/**

      - name: Upload Velopack releases
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-velopack-releases
          path: publish/edge-velopack/**
