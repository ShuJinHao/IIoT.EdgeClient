name: edge-smoke-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOTNET_NOLOGO: true
  EDGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  smoke-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate Edge governance baseline monotonicity behavior
        shell: pwsh
        run: ./scripts/tests/Test-EdgeGovernanceBaselineMonotonicityBehavior.ps1

      - name: Validate Edge governance baselines against immutable history
        shell: pwsh
        run: ./scripts/tests/Test-EdgeGovernanceBaselineMonotonicity.ps1 -RepositoryRoot . -BaseRef $env:EDGE_BASE_REF

      - name: Validate Edge test inventory
        shell: pwsh
        run: ./scripts/tests/Get-EdgeTestInventory.ps1 -OutputPath artifacts/test-inventory.actual.json

      - name: Validate Edge architecture project graph
        shell: pwsh
        run: ./scripts/tests/Test-EdgeArchitectureProjectGraph.ps1 -RepositoryRoot . -SolutionPath IIoT.EdgeClient.slnx -Configuration Release

      - name: Validate Edge compatibility inventory
        shell: pwsh
        run: ./scripts/tests/Test-EdgeCompatibilityInventory.ps1 -RepositoryRoot .

      - name: Validate Edge compatibility negative fixtures
        shell: pwsh
        run: ./scripts/tests/Test-EdgeCompatibilityInventoryFixtures.ps1 -RepositoryRoot .

      - name: Validate Edge duplication ratchet
        shell: pwsh
        run: ./scripts/tests/Test-EdgeDuplicationBaseline.ps1 -RepositoryRoot .

      - name: Validate Edge source quality policy
        shell: pwsh
        run: ./scripts/tests/Test-EdgeSourceQualityPolicy.ps1 -RepositoryRoot .

      - name: Validate Edge regression ledger
        shell: pwsh
        run: ./scripts/tests/Test-EdgeRegressionLedger.ps1 -RepositoryRoot .

      - name: Validate Edge analyzer build fixtures
        shell: pwsh
        run: ./scripts/tests/Test-EdgeArchitectureAnalyzerFixtures.ps1 -RepositoryRoot . -Configuration Release

      - name: Restore Edge solution
        shell: pwsh
        run: dotnet restore IIoT.EdgeClient.slnx -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse

      - name: Setup Python for deployment behavior tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run Edge deployment behavior tests
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeDeploymentPolicy.ps1
          ./scripts/tests/TestEdgeDeploymentBehavior.ps1
          ./scripts/tests/TestEdgeReleaseResumeBehavior.ps1

      - name: Enforce shared UI baseline
        shell: pwsh
        run: ./scripts/CheckEdgeUiSharedBaseline.ps1

      - name: Build Edge solution and test assemblies
        shell: pwsh
        run: dotnet build IIoT.EdgeClient.slnx -c Release --no-restore -m:1 -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Reconcile Edge discovered test inventory
        shell: pwsh
        run: ./scripts/tests/Get-EdgeDiscoveredTestInventory.ps1 -RepositoryRoot . -Configuration Release -OutputPath artifacts/discovered-test-inventory.actual.json

      - name: Run every required Edge test runner
        shell: pwsh
        run: ./scripts/tests/Invoke-EdgeRequiredTests.ps1 -ResultsDirectory artifacts/test-results -Configuration Release -CollectCoverage

      - name: Confirm Edge required test results
        shell: pwsh
        run: ./scripts/tests/Confirm-EdgeRequiredTestResults.ps1 -ResultsDirectory artifacts/test-results -SummaryPath artifacts/test-results/summary.json

      - name: Validate Edge coverage ratchet
        shell: pwsh
        run: ./scripts/tests/Test-EdgeCoverageBaseline.ps1 -ResultsDirectory artifacts/test-results

      - name: Upload Edge required test and coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edge-required-test-evidence
          path: |
            artifacts/discovered-test-inventory.actual.json
            artifacts/test-results/**/*.trx
            artifacts/test-results/**/coverage.cobertura.xml
            artifacts/test-results/summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Scan vulnerable NuGet packages
        shell: pwsh
        run: ./scripts/TestEdgePackageVulnerabilities.ps1

  mutation-report:
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore pinned Edge mutation tool
        shell: pwsh
        run: dotnet tool restore

      - name: Restore Edge Domain mutation target
        shell: pwsh
        run: dotnet restore src/Tests/IIoT.Edge.Domain.Tests/IIoT.Edge.Domain.Tests.csproj -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse

      - name: Collect Edge report-only mutation baseline
        shell: pwsh
        run: ./scripts/tests/Test-EdgeMutationBaseline.ps1 -Collect

      - name: Upload Edge mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edge-mutation-report
          path: |
            artifacts/mutation/edge-domain/**/mutation-report.json
            artifacts/mutation/edge-domain/stryker-console.log
          if-no-files-found: warn
          retention-days: 14
