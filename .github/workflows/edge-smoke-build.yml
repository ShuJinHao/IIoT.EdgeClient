name: edge-smoke-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "default=Architecture/Security + affected Business; heavy lanes require an explicit mode"
        required: true
        type: choice
        default: default
        options:
          - default
          - quality
          - cross-project
          - full
      cloud_ref:
        description: "Cloud ref used only by cross-project mode"
        required: false
        type: string
        default: main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  CI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'default' }}
  EDGE_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  smoke-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'cross-project' }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Select current scope and validate selector only when affected
        id: select
        shell: pwsh
        run: |
          $baseRef = $env:EDGE_BASE_REF
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            $baseRef = 'HEAD^'
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8
          $selectorInputs = @(
            & git -c core.quotepath=false diff --name-only $baseRef HEAD -- `
              '.github/workflows/edge-smoke-build.yml' `
              'scripts/tests/Select-EdgeCiTests.ps1' `
              'scripts/tests/Invoke-EdgeCiSelectedTests.ps1' `
              'scripts/tests/Test-EdgeCiTestSelection.ps1'
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to determine whether the Edge CI selector changed.'
          }
          if ($selectorInputs.Count -gt 0) {
            ./scripts/tests/Test-EdgeCiTestSelection.ps1
          } else {
            Write-Host 'Edge CI selector behavior test skipped because selector inputs are unaffected.'
          }
          ./scripts/tests/Select-EdgeCiTests.ps1 `
            -Mode $env:CI_MODE `
            -BaseRef $baseRef `
            -HeadRef HEAD `
            -OutputPath artifacts/ci-selection.json

      - name: Restore selected test projects
        shell: pwsh
        run: |
          $selection = Get-Content artifacts/ci-selection.json -Raw | ConvertFrom-Json
          $restoreProjects = @(
            'src/Edge/IIoT.Edge.Shell/IIoT.Edge.Shell.csproj'
            'src/Tools/IIoT.Edge.RuntimeLayoutSync/IIoT.Edge.RuntimeLayoutSync.csproj'
            'src/Testing/IIoT.Edge.Module.TestPlugin.Companion/IIoT.Edge.Module.TestPlugin.Companion.csproj'
            @($selection.selectedDotNetProjects.path)
          ) | Sort-Object -Unique
          foreach ($projectPath in $restoreProjects) {
            & dotnet restore $projectPath -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse
            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for selected architecture/test project: $projectPath"
            }
          }

      - name: Validate architecture and security policies
        shell: pwsh
        run: |
          ./scripts/tests/Test-EdgeArchitectureProjectGraph.ps1 -RepositoryRoot . -SolutionPath IIoT.EdgeClient.slnx -Configuration Release
          ./scripts/tests/Test-EdgeArchitectureAnalyzerFixtures.ps1 -RepositoryRoot . -Configuration Release

      - name: Run selected tests and record current discovery
        shell: pwsh
        run: |
          $parameters = @{
            SelectionPath = 'artifacts/ci-selection.json'
            ResultsDirectory = 'artifacts/ci-test-results'
            Configuration = 'Release'
          }
          if ($env:CI_MODE -eq 'full') {
            $parameters.CollectCoverage = $true
          }
          ./scripts/tests/Invoke-EdgeCiSelectedTests.ps1 @parameters

      - name: Setup Python only for affected deployment behavior
        if: ${{ steps.select.outputs.deployment_affected == 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run affected deployment behavior
        if: ${{ steps.select.outputs.deployment_affected == 'true' }}
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeDeploymentPolicy.ps1
          ./scripts/tests/TestEdgeDeploymentBehavior.ps1
          ./scripts/tests/TestEdgeDependencyClosureBehavior.ps1
          ./scripts/tests/TestEdgeReleaseResumeBehavior.ps1

      - name: Run explicit quality gates
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'quality' || inputs.mode == 'full') }}
        shell: pwsh
        run: |
          ./scripts/tests/Test-EdgeSourceQualityPolicy.ps1 -RepositoryRoot .
          ./scripts/CheckEdgeUiSharedBaseline.ps1
          ./scripts/tests/Test-EdgeGovernanceBaselineMonotonicityBehavior.ps1
          ./scripts/tests/Test-EdgeCompatibilityInventory.ps1 -RepositoryRoot .
          ./scripts/tests/Test-EdgeCompatibilityInventoryFixtures.ps1 -RepositoryRoot .
          ./scripts/tests/Test-EdgeDuplicationBaseline.ps1 -RepositoryRoot .
          ./scripts/tests/Test-EdgeMutationBaselineBehavior.ps1
          dotnet tool restore
          ./scripts/tests/Test-EdgeMutationBaseline.ps1 -Collect

      - name: Scan vulnerable packages only in explicit full mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        shell: pwsh
        run: ./scripts/TestEdgePackageVulnerabilities.ps1

      - name: Upload selected test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edge-ci-${{ env.CI_MODE }}-evidence
          path: |
            artifacts/ci-selection.json
            artifacts/ci-test-results/**
            artifacts/mutation/**
          if-no-files-found: warn
          retention-days: 14

  cross-project:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'cross-project' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Edge candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: IIoT.EdgeClient

      - name: Checkout Cloud candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ShuJinHao/IIoT.CloudPlatform
          ref: ${{ inputs.cloud_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: IIoT.CloudPlatform

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: IIoT.EdgeClient/global.json

      - name: Select and restore cross-project contract runners
        shell: pwsh
        working-directory: IIoT.EdgeClient
        run: |
          ./scripts/tests/Select-EdgeCiTests.ps1 `
            -Mode CrossProject `
            -ChangedFiles @() `
            -OutputPath artifacts/ci-selection.json `
            -GitHubOutputPath ''
          $selection = Get-Content artifacts/ci-selection.json -Raw | ConvertFrom-Json
          foreach ($project in @($selection.selectedDotNetProjects)) {
            & dotnet restore $project.path -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse
            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for cross-project runner: $($project.path)"
            }
          }

      - name: Run selected contract tests and compare provider snapshot
        shell: pwsh
        working-directory: IIoT.EdgeClient
        run: |
          ./scripts/tests/Invoke-EdgeCiSelectedTests.ps1 -SelectionPath artifacts/ci-selection.json -ResultsDirectory artifacts/ci-test-results -Configuration Release
          ./scripts/tests/Test-EdgeCloudContractAlignment.ps1 `
            -CloudRepositoryRoot ../IIoT.CloudPlatform `
            -OutputPath artifacts/cross-project/edge-cloud-contract.json

      - name: Upload cross-project evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: edge-cloud-cross-project-evidence
          path: |
            IIoT.EdgeClient/artifacts/ci-selection.json
            IIoT.EdgeClient/artifacts/ci-test-results/**
            IIoT.EdgeClient/artifacts/cross-project/**
          if-no-files-found: warn
          retention-days: 14
