name: edge-smoke-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOTNET_NOLOGO: true

jobs:
  smoke-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate trusted baseline migration
        shell: pwsh
        run: |
          # EDGE-BASELINE-MIG-TRUSTED-EXECUTOR-V1
          $trustedBase = '${{ github.event.pull_request.base.sha || github.event.before }}'
          $candidate = '${{ github.event.pull_request.head.sha || github.sha }}'
          $trustedWrapperPath = 'scripts/tests/baselines/migrations/InvokeEdgeBaselineMigrationFromTrustedBase.v1.ps1'
          $entry = (git ls-tree $trustedBase -- $trustedWrapperPath | Out-String).Trim()
          $entryPattern = '^100644 blob (?<ObjectId>[0-9a-f]+)\t' + [regex]::Escape($trustedWrapperPath) + '$'
          if ($LASTEXITCODE -ne 0 -or $entry -notmatch $entryPattern) {
            throw 'Trusted base does not contain the reviewed migration wrapper.'
          }
          $temporaryWrapper = Join-Path $env:RUNNER_TEMP 'edge-baseline-migration-wrapper.ps1'
          try {
            & git cat-file blob $Matches.ObjectId > $temporaryWrapper
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract the trusted migration wrapper.' }
            $extractedObjectId = (git hash-object --no-filters -- $temporaryWrapper | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $extractedObjectId -cne $Matches.ObjectId) {
              throw 'Extracted migration wrapper differs from the trusted Git blob.'
            }
            & pwsh -NoLogo -NoProfile -NonInteractive -File $temporaryWrapper `
              -RepositoryRoot . `
              -TrustedBaseRevision $trustedBase `
              -CandidateRevision $candidate `
              -AnchorRelationship BaseAncestorOfHead
            if ($LASTEXITCODE -ne 0) { throw "Trusted migration validation failed with exit code $LASTEXITCODE." }
          }
          finally {
            Remove-Item $temporaryWrapper -Force -ErrorAction SilentlyContinue
          }
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate reviewed restore and build inputs
        shell: pwsh
        run: ./scripts/tests/TestEdgeTestGovernancePolicy.ps1 -Mode ValidateStatic -Configuration Release

      - name: Restore Edge solution
        shell: pwsh
        run: dotnet restore IIoT.EdgeClient.slnx -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse

      - name: Run Edge test governance self-tests
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeTestGovernanceBehavior.ps1
          ./scripts/tests/TestEdgeTestGovernancePolicy.ps1 -Mode ValidateRunnerCaseNormalization
          ./scripts/tests/TestEdgeTestGovernancePolicy.ps1 -Mode ValidateStatic -Configuration Release

      - name: Run Edge baseline migration self-tests
        shell: pwsh
        run: ./scripts/tests/baselines/migrations/TestEdgeBaselineMigrationValidator.v1.ps1

      - name: Setup Python for deployment behavior tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run Edge deployment behavior tests
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeDeploymentPolicy.ps1
          ./scripts/tests/TestEdgeDeploymentBehavior.ps1
          ./scripts/tests/TestEdgeReleaseResumeBehavior.ps1

      - name: Enforce shared UI baseline
        shell: pwsh
        run: ./scripts/CheckEdgeUiSharedBaseline.ps1

      - name: Build Edge solution and test assemblies
        shell: pwsh
        run: dotnet build IIoT.EdgeClient.slnx -c Release --no-restore -m:1 -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Validate Edge test repository and legacy discovery ceilings
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeTestGovernancePolicy.ps1 -Mode ValidateRepository -Configuration Release
          ./scripts/tests/TestEdgeTestGovernancePolicy.ps1 -Mode ValidateDiscovery -Configuration Release

      - name: Run architecture policy tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Shell.Tests/IIoT.Edge.Shell.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~RepositoryHygieneTests" -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run plugin conformance tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Module.ContractTests/IIoT.Edge.Module.ContractTests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run remaining shell behavior tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Shell.Tests/IIoT.Edge.Shell.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName!~RepositoryHygieneTests" -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run shared UI behavior tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.UI.Shared.Tests/IIoT.Edge.UI.Shared.Tests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run launcher tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Launcher.Tests/IIoT.Edge.Launcher.Tests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run installer tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Installer.Tests/IIoT.Edge.Installer.Tests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run infrastructure update tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Infrastructure.Update.Tests/IIoT.Edge.Infrastructure.Update.Tests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run non-UI regression tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.NonUiRegressionTests/IIoT.Edge.NonUiRegressionTests.csproj -c Release --no-build --no-restore -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Scan vulnerable NuGet packages
        shell: pwsh
        run: ./scripts/TestEdgePackageVulnerabilities.ps1
