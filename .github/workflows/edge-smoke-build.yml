name: edge-smoke-build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  DOTNET_NOLOGO: true

jobs:
  smoke-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate Edge test inventory
        shell: pwsh
        run: ./scripts/tests/Get-EdgeTestInventory.ps1 -OutputPath artifacts/test-inventory.actual.json

      - name: Restore Edge solution
        shell: pwsh
        run: dotnet restore IIoT.EdgeClient.slnx -p:RestoreDisableParallel=true --disable-build-servers -noAutoResponse

      - name: Setup Python for deployment behavior tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run Edge deployment behavior tests
        shell: pwsh
        run: |
          ./scripts/tests/TestEdgeDeploymentPolicy.ps1
          ./scripts/tests/TestEdgeDeploymentBehavior.ps1
          ./scripts/tests/TestEdgeReleaseResumeBehavior.ps1

      - name: Enforce shared UI baseline
        shell: pwsh
        run: ./scripts/CheckEdgeUiSharedBaseline.ps1

      - name: Build Edge solution and test assemblies
        shell: pwsh
        run: dotnet build IIoT.EdgeClient.slnx -c Release --no-restore -m:1 -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run plugin conformance tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Module.ContractTests/IIoT.Edge.Module.ContractTests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.Module.ContractTests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run shell tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Shell.Tests/IIoT.Edge.Shell.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.Shell.Tests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run shared UI behavior tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.UI.Shared.Tests/IIoT.Edge.UI.Shared.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.UI.Shared.Tests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run launcher tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Launcher.Tests/IIoT.Edge.Launcher.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.Launcher.Tests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run installer tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Installer.Tests/IIoT.Edge.Installer.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.Installer.Tests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run infrastructure update tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.Infrastructure.Update.Tests/IIoT.Edge.Infrastructure.Update.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.Infrastructure.Update.Tests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Run non-UI regression tests
        shell: pwsh
        run: dotnet test src/Tests/IIoT.Edge.NonUiRegressionTests/IIoT.Edge.NonUiRegressionTests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=IIoT.Edge.NonUiRegressionTests.trx" --results-directory artifacts/test-results -p:BuildInParallel=false --disable-build-servers --nologo -noAutoResponse

      - name: Confirm Edge required test results
        shell: pwsh
        run: ./scripts/tests/Confirm-EdgeRequiredTestResults.ps1 -ResultsDirectory artifacts/test-results -SummaryPath artifacts/test-results/summary.json

      - name: Scan vulnerable NuGet packages
        shell: pwsh
        run: ./scripts/TestEdgePackageVulnerabilities.ps1
